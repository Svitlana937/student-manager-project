<!-- Bootstrap via CDN https://getbootstrap.com/-->

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Student Directory</h1>
            <a href="{{ url_for('logout') }}" class="btn btn-outline-secondary">Logout</a>
        </div>

        <div class="card mb-5 shadow-sm">
            <div class="card-body">
               
                <h5 class="card-title">Add New Student</h5>
                <form action="{{ url_for('add_student') }}" method="POST" class="form-inline">
                    <input type="text" name="name" class="form-control mb-2 mr-sm-2" placeholder="Student Name" required>
                    <input type="number" name="age" class="form-control mb-2 mr-sm-2" placeholder="Age" required>
                    <button type="submit" class="btn btn-primary mb-2">Add Student</button>                    
                </form>
            </div>
        </div>

    <div class="row">
    {% for student in students %} 
    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                 <div class="text-center mb-2">
                    <!-- Reference: DiceBear Avatars -->    
                    <!-- https://www.dicebear.com/how-to-use/http-api/-->
                    <!--https://www.dicebear.com/styles/adventurer/-->
                     <img src="https://api.dicebear.com/9.x/adventurer/svg?seed={{ student.name }}" style="width: 80px; border-radius: 50%;">
                </div>
                <h5 class="card-title text-primary">{{ student.name }}</h5>
                <p class="card-text">
                    <strong>ID:</strong> {{ student.id }} <br>
                    <strong>Age:</strong> {{ student.age }}
                </p>
            </div>
            <div class="card-footer bg-transparent border-top-0">
                <a href="{{ url_for('delete_student', student_id=student.id) }}" 
                   class="btn btn-outline-danger btn-sm w-100">Delete Student</a>
                <a href="{{ url_for('edit_student', student_id=student.id) }}" 
                   class="btn btn-outline-primary btn-sm w-100 mt-2">Edit Student</a>
            </div>
        </div>
    </div>
    {% endfor %} </div>

        {% if not students %}
    <p class="text-center text-muted">Empty list. Add the first student!</p>
{% endif %}
    </div>
</body>
</html>
