<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4 text-center">Student Directory</h1>

        <div class="card mb-5 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Add New Student</h5>
                <form action="/add_student" method="POST" class="form-inline">
                    <input type="text" name="name" class="form-control mb-2 mr-sm-2" placeholder="Student Name" required>
                    <input type="number" name="age" class="form-control mb-2 mr-sm-2" placeholder="Age" required>
                    <button type="submit" class="btn btn-primary mb-2">Add Student</button>
                </form>
            </div>
        </div>

        <div class="row">
            {% for student in students %}
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm student-card">
                    <div class="card-body">
                        <h5 class="card-title">{{ student.name }}</h5>
                        <p class="card-text text-muted">Student ID: {{ student.id }}</p>
                        <p class="card-text">Age: <strong>{{ student.age }}</strong></p>
                        <a href="/api/students/{{ student.id }}" class="btn btn-outline-primary btn-sm">View JSON</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% if not students %}
    <p class="text-center text-muted">Empty list. Add the first student!</p>
{% endif %}
    </div>
</body>
</html>
